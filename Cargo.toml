[workspace]
members = ["."]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "Elastic-2.0"
repository = "https://github.com/HayaoSuzuki/kiryl"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"

[package]
name = "kiryl"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Fuzz testing tools for Python"
publish = false

[lints]
workspace = true

[profile.release]
lto = "thin"
strip = true

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
ctrlc = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_IO", "Win32_System_SystemServices"] }

[dev-dependencies]
proptest = "1"
rstest = { version = "0.28.0", default-features = false }
