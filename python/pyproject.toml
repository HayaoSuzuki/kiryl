[project]
name = "kiryl-python-adapter"
version = "0.0.0"
requires-python = ">=3.14,<3.16"
dependencies = ["hypothesis==6.170.13", "pytest==9.2.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["kiryl_adapter", ".."]
required_plugins = ["pytest-cov", "pytest-randomly"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["ALL"]
# Pick one docstring convention and let the formatter own trailing commas.
ignore = ["D203", "D213", "COM812"]

[tool.ruff.lint.per-file-ignores]
# Assertions are the test oracle; pytest discovers this non-package directory.
"tests/*.py" = ["S101", "INP001"]
# Planted comparison properties intentionally assert defects; not normal discovery.
"specimens/*.py" = ["S101", "INP001"]
# These flat modules form a standalone, unpublished experiment, not a package.
"*.py" = ["INP001"]
# Approved version-pinned Hypothesis compatibility boundary only.
"hypothesis_bridge.py" = ["INP001", "SLF001"]

[tool.ty.environment]
extra-paths = ["kiryl_adapter", "..", "../tools"]

[tool.ty.analysis]
respect-type-ignore-comments = false
strict-equality-semantics = true
strict-generic-narrowing = true

[tool.ty.rules]
all = "error"

[tool.ty.terminal]
error-on-warning = true

[dependency-groups]
dev = [
    "pytest-cov==7.1.0",
    "pytest-randomly>=5,<6",
    "ruff==0.17.3",
    "ty==0.0.95",
]

[tool.coverage.run]
branch = true
parallel = true
relative_files = false
source = ["kiryl_adapter", "tests", "../tools"]
patch = ["subprocess", "_exit"]

[tool.coverage.report]
include = ["*/kiryl_adapter/*", "*/python/tests/*", "*/tools/run_coverage.py", "*/tools/report_coverage.py"]
show_missing = true
precision = 2
fail_under = 100
skip_empty = true

[tool.coverage.paths]
adapter = ["kiryl_adapter", "*/python/kiryl_adapter", '*\\python\\kiryl_adapter']
tests = ["tests", "*/python/tests", '*\\python\\tests']
