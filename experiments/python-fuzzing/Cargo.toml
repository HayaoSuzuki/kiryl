[workspace]
[package]
name = "fuzz-probe"
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
license = "Elastic-2.0"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ctrlc = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
proptest = "1"
tempfile = "3"

[lints.clippy]
all = "deny"
pedantic = "deny"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_IO", "Win32_System_SystemServices"] }
